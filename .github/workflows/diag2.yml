name: Diag2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Collect
        continue-on-error: true
        run: |
          ': ' > diag.txt
          {
            echo "== env =="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "== file =="
            ls -l DeskPetApp.png || true
            file DeskPetApp.png || true
            head -c 24 DeskPetApp.png | od -c | head -2 || true
            echo "== tar =="
            tar -tzf DeskPetApp.png 2>&1 | head -3
            echo "tar_rc=$?"
            echo "== sdk dirs =="
            ls "$ANDROID_HOME/build-tools" 2>&1 | head -5 || true
            ls "$ANDROID_HOME/platforms" 2>&1 | head -5 || true
          } >> diag.txt 2>&1
          tar -xzf DeskPetApp.png >> diag.txt 2>&1
          echo "unpack_rc=$?" >> diag.txt
          if [ -f DeskPetApp/build.sh ]; then
            ( cd DeskPetApp && sh ./build.sh "$ANDROID_HOME" ) >> diag.txt 2>&1
            echo "build_rc=$?" >> diag.txt
            ls -l DeskPetApp/build >> diag.txt 2>&1
          fi

      - name: Commit
        if: always()
        run: |
          git config user.name "ci-diag"
          git config user.email "ci@example.com"
          git add -A
          git commit -m "diag $(date -u +%H%M%S)" || true
          git push || true
